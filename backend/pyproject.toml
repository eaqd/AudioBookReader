[project]
name = "audiobookreader-backend"
version = "0.1.0"
description = "PDF -> audiobook ingest API (FastAPI + Kokoro + WhisperX)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pymupdf>=1.24",
  "pydub>=0.25.1",
  "sse-starlette>=2.1",
  "arq>=0.26",
  "redis>=5.0",
  "sqlalchemy>=2.0",
  "aiosqlite>=0.19",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "soundfile>=0.12",
  "numpy>=1.26",
]

[project.optional-dependencies]
ml = [
  "kokoro>=0.9.4",
  "whisperx>=3.1.1",
  "torch>=2.2",
]
dev = [
  "ruff",
  "pytest",
  "httpx",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
